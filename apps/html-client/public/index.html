<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Story HTML Client</title>
    <script>
      (() => {
        const story = window.location.pathname.split("/").filter(Boolean)[0] || "demo"
        const encodedStory = encodeURIComponent(story)
        const storyRoot = `/${encodedStory}/`

        if (window.location.pathname !== storyRoot) {
          window.location.replace(storyRoot)
          return
        }

        const basePath = `/${encodedStory}`
        const style = document.createElement("link")
        style.rel = "stylesheet"
        style.href = `${basePath}/styles.css`
        document.head.append(style)

        const script = document.createElement("script")
        script.defer = true
        script.src = `${basePath}/app.js`
        document.head.append(script)
      })()
    </script>
  </head>
  <body>
    <div id="app" class="app-shell">
      <section class="center-state">
        <div class="loading-dot"></div>
        <p>正在启动 HTML 客户端...</p>
      </section>
    </div>
    <div id="toast" class="toast" hidden></div>
  </body>
</html>
